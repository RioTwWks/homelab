{{- if .Values.redis.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "moltbot.fullname" . }}-redis
  labels:
    {{- include "moltbot.labels" . | nindent 4 }}
    app.kubernetes.io/name: {{ include "moltbot.fullname" . }}-redis
    app.kubernetes.io/component: redis
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: {{ .Values.redis.persistence.storageClass }}
  resources:
    requests:
      storage: {{ .Values.redis.persistence.size }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "moltbot.fullname" . }}-redis
  labels:
    {{- include "moltbot.labels" . | nindent 4 }}
    app.kubernetes.io/name: {{ include "moltbot.fullname" . }}-redis
    app.kubernetes.io/component: redis
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "moltbot.fullname" . }}-redis
  template:
    metadata:
      labels:
        {{- include "moltbot.labels" . | nindent 8 }}
        app.kubernetes.io/name: {{ include "moltbot.fullname" . }}-redis
        app.kubernetes.io/component: redis
    spec:
      containers:
        - name: redis
          image: "{{ .Values.redis.image.repository }}:{{ .Values.redis.image.tag }}"
          imagePullPolicy: {{ .Values.redis.image.pullPolicy }}
          args: ["redis-server", "--appendonly", "yes"]
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            {{- toYaml .Values.redis.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "moltbot.fullname" . }}-redis
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "moltbot.fullname" . }}-redis
  labels:
    {{- include "moltbot.labels" . | nindent 4 }}
    app.kubernetes.io/name: {{ include "moltbot.fullname" . }}-redis
    app.kubernetes.io/component: redis
spec:
  type: {{ .Values.redis.service.type }}
  selector:
    app.kubernetes.io/name: {{ include "moltbot.fullname" . }}-redis
  ports:
    - name: redis
      port: {{ .Values.redis.service.port }}
      targetPort: redis
      {{- if eq .Values.redis.service.type "NodePort" }}
      nodePort: {{ .Values.redis.service.nodePort }}
      {{- end }}
{{- end }}
