{{- if .Values.ui.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "moltbot.fullname" . }}-ui-nginx
  labels:
    {{- include "moltbot.labels" . | nindent 4 }}
    app.kubernetes.io/name: {{ include "moltbot.fullname" . }}-ui
    app.kubernetes.io/component: ui
data:
  default.conf: |
    server {
      listen 80;
      server_name _;

      root /usr/share/nginx/html;
      index index.html;

      location / {
        try_files $uri $uri/ /index.html;
      }

      # Прокси на оркестратор без CORS: /api/v1/chat → <upstream>/v1/chat
      location /api/ {
        proxy_pass {{ .Values.ui.apiUpstream }}/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
      }

      location /docs {
        proxy_pass {{ .Values.ui.apiUpstream }}/docs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
      }
      location = /openapi.json {
        proxy_pass {{ .Values.ui.apiUpstream }}/openapi.json;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
      }
      location /redoc {
        proxy_pass {{ .Values.ui.apiUpstream }}/redoc;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "moltbot.fullname" . }}-ui
  labels:
    {{- include "moltbot.labels" . | nindent 4 }}
    app.kubernetes.io/name: {{ include "moltbot.fullname" . }}-ui
    app.kubernetes.io/component: ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "moltbot.fullname" . }}-ui
  template:
    metadata:
      labels:
        {{- include "moltbot.labels" . | nindent 8 }}
        app.kubernetes.io/name: {{ include "moltbot.fullname" . }}-ui
        app.kubernetes.io/component: ui
    spec:
      containers:
        - name: nginx
          image: "{{ .Values.ui.image.repository }}:{{ .Values.ui.image.tag }}"
          imagePullPolicy: {{ .Values.ui.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            {{- toYaml .Values.ui.resources | nindent 12 }}
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
      volumes:
        - name: nginx-conf
          configMap:
            name: {{ include "moltbot.fullname" . }}-ui-nginx
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "moltbot.fullname" . }}-ui
  labels:
    {{- include "moltbot.labels" . | nindent 4 }}
    app.kubernetes.io/name: {{ include "moltbot.fullname" . }}-ui
    app.kubernetes.io/component: ui
spec:
  type: {{ .Values.ui.service.type }}
  selector:
    app.kubernetes.io/name: {{ include "moltbot.fullname" . }}-ui
  ports:
    - name: http
      port: {{ .Values.ui.service.port }}
      targetPort: http
      {{- if eq .Values.ui.service.type "NodePort" }}
      nodePort: {{ .Values.ui.service.nodePort }}
      {{- end }}
{{- end }}
