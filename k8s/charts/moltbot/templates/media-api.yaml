{{- if .Values.mediaApi.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "moltbot.fullname" . }}-media-api
  labels:
    {{- include "moltbot.labels" . | nindent 4 }}
    app.kubernetes.io/name: {{ include "moltbot.fullname" . }}-media-api
    app.kubernetes.io/component: media-api
data:
  {{- range $key, $value := .Values.mediaApi.env }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "moltbot.fullname" . }}-media-api
  labels:
    {{- include "moltbot.labels" . | nindent 4 }}
    app.kubernetes.io/name: {{ include "moltbot.fullname" . }}-media-api
    app.kubernetes.io/component: media-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "moltbot.fullname" . }}-media-api
  template:
    metadata:
      labels:
        {{- include "moltbot.labels" . | nindent 8 }}
        app.kubernetes.io/name: {{ include "moltbot.fullname" . }}-media-api
        app.kubernetes.io/component: media-api
    spec:
      containers:
        - name: media-api
          image: "{{ .Values.mediaApi.image.repository }}:{{ .Values.mediaApi.image.tag }}"
          imagePullPolicy: {{ .Values.mediaApi.image.pullPolicy }}
          envFrom:
            - configMapRef:
                name: {{ include "moltbot.fullname" . }}-media-api
          ports:
            - name: http
              containerPort: 8090
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            {{- toYaml .Values.mediaApi.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "moltbot.fullname" . }}-media-api
  labels:
    {{- include "moltbot.labels" . | nindent 4 }}
    app.kubernetes.io/name: {{ include "moltbot.fullname" . }}-media-api
    app.kubernetes.io/component: media-api
spec:
  type: {{ .Values.mediaApi.service.type }}
  selector:
    app.kubernetes.io/name: {{ include "moltbot.fullname" . }}-media-api
  ports:
    - name: http
      port: {{ .Values.mediaApi.service.port }}
      targetPort: http
      {{- if eq .Values.mediaApi.service.type "NodePort" }}
      nodePort: {{ .Values.mediaApi.service.nodePort }}
      {{- end }}
{{- end }}
