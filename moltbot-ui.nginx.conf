server {
  listen 80;
  server_name _;

  # Static UI
  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # Proxy to moltbot-api without CORS.
  # UI calls /api/v1/chat → backend /v1/chat
  location /api/ {
    proxy_pass http://moltbot-api:8080/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Convenience: expose FastAPI docs under the same origin
  location /docs {
    proxy_pass http://moltbot-api:8080/docs;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }
  location = /openapi.json {
    proxy_pass http://moltbot-api:8080/openapi.json;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }
  location /redoc {
    proxy_pass http://moltbot-api:8080/redoc;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }
}

