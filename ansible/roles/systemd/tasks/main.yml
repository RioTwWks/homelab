---
- name: Install whisper-server systemd unit (legacy stack)
  ansible.builtin.template:
    src: whisper-server.service.j2
    dest: /etc/systemd/system/whisper-server.service
    mode: "0644"
  when:
    - voice_backend | default('hermes') == 'legacy'
    - moltbot_enable_systemd_whisper | bool
  notify: Reload systemd

- name: Enable whisper-server (legacy stack)
  ansible.builtin.systemd:
    name: whisper-server
    enabled: true
    state: started
    daemon_reload: true
  when:
    - voice_backend | default('hermes') == 'legacy'
    - moltbot_enable_systemd_whisper | bool

- name: Install FLM ASR server systemd unit (Hermes NPU STT)
  ansible.builtin.template:
    src: flm-asr.service.j2
    dest: /etc/systemd/system/flm-asr.service
    mode: "0644"
  when:
    - voice_backend | default('hermes') == 'hermes'
    - hermes_enable_npu_stt | bool
    - moltbot_enable_systemd_flm_asr | bool
  notify: Reload systemd

- name: Enable FLM ASR server
  ansible.builtin.systemd:
    name: flm-asr
    enabled: true
    state: started
    daemon_reload: true
  when:
    - voice_backend | default('hermes') == 'hermes'
    - hermes_enable_npu_stt | bool
    - moltbot_enable_systemd_flm_asr | bool

- name: Install timer-worker systemd unit
  ansible.builtin.template:
    src: timer-worker.service.j2
    dest: /etc/systemd/system/timer-worker.service
    mode: "0644"
  when: moltbot_enable_systemd_timer_worker | bool
  notify: Reload systemd

- name: Enable timer-worker
  ansible.builtin.systemd:
    name: timer-worker
    enabled: true
    state: started
    daemon_reload: true
  when: moltbot_enable_systemd_timer_worker | bool

- name: Install homelab-backup service and timer
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "/etc/systemd/system/{{ item.dest }}"
    mode: "0644"
  loop:
    - { src: homelab-backup.service.j2, dest: homelab-backup.service }
    - { src: homelab-backup.timer.j2, dest: homelab-backup.timer }
  when: moltbot_enable_backup_timer | bool
  notify: Reload systemd

- name: Enable homelab-backup timer
  ansible.builtin.systemd:
    name: homelab-backup.timer
    enabled: true
    state: started
    daemon_reload: true
  when: moltbot_enable_backup_timer | bool
