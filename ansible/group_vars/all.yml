---
# Paths — resolved in playbook pre_tasks from playbook_dir (override in local.yml if needed)
moltbot_install_dir: ""
moltbot_compose_project_name: homelab

# Preset → docker compose profiles
moltbot_profile_presets:
  minimal:
    - ui
  voice:
    - ui
    - search
  storage:
    - ui
    - storage
  photos:
    - ui
    - photos
  full:
    - ui
    - ha
    - storage
    - photos
    - torrents
    - search
    - gitlab

# Active preset if moltbot_profiles not set explicitly
moltbot_preset: minimal

# Resolved in playbook pre_tasks from moltbot_preset or explicit list in local.yml

# Feature flags
moltbot_enable_voice: false
moltbot_enable_ollama: true
moltbot_enable_systemd_whisper: false
moltbot_enable_systemd_timer_worker: false
moltbot_enable_backup_timer: false

# Ollama
ollama_base_url: http://host.docker.internal:11434
ollama_models:
  - qwen3:4b
  - qwen3:8b

# Docker / app
tz: Europe/Moscow
default_weather_city: ""
default_weather_district: ""
web_search_provider: off
searxng_base_url: http://searxng:8080
searxng_public_url: http://localhost:18081
media_executor_url: ""

# Optional integrations (empty = disabled)
home_assistant_url: ""
home_assistant_token: ""
openweather_api_key: ""
yandex_weather_api_key: ""

# Nextcloud (profile storage)
nextcloud_admin_user: admin
nextcloud_admin_password: ""
nextcloud_db_password: nextcloud
nextcloud_trusted_domains: "localhost 127.0.0.1"

# GitLab (profile gitlab)
gitlab_external_url: http://localhost:18090
grafana_admin_password: admin

# Voice (host) — Hermes default (Phase 2); legacy whisper.cpp optional
voice_backend: hermes
voice_user: "{{ ansible_user_id | default(lookup('env', 'USER')) }}"
hermes_home: "{{ ansible_env.HOME }}/.hermes"
hermes_ollama_base_url: http://127.0.0.1:11434
hermes_llm_model: qwen3:8b
hermes_context_length: 65536
hermes_stt_language: ru
hermes_faster_whisper_model: base
hermes_wake_word_en: hey hermes
hermes_wake_word_ru: "привет хермес"
hermes_edge_voice: ru-RU-DmitryNeural
hermes_enable_npu_stt: false
flm_serve_model: gemma3:1b
flm_serve_port: 52625
flm_pmode: powersaver
moltbot_enable_systemd_flm_asr: false

whisper_cpp_dir: "{{ ansible_env.HOME }}/.local/src/whisper.cpp"
whisper_model_name: medium
whisper_server_port: 8099
tts_engine: piper
piper_venv: "{{ ansible_env.HOME }}/.venvs/piper"
silero_venv: "{{ ansible_env.HOME }}/.venvs/silero"

# Backup timer
backup_dir: /backup/homelab
backup_retention_days: 14

# Remote access (docs/remote-access.md) — secrets only in local.yml
remote_access_install_tailscale_client: false
remote_access_headscale_login_server: ""
remote_access_tailscale_authkey: ""
remote_access_install_cloudflared: false
remote_access_cloudflare_tunnel_name: homelab
remote_access_cloudflare_tunnel_id: ""
remote_access_cloudflare_credentials_path: /etc/cloudflared/credentials.json
remote_access_cloudflare_config_path: /etc/cloudflared/config.yml
remote_access_cloudflare_ingress:
  - hostname: moltbot.example.com
    service: http://localhost:18079
  - hostname: api-moltbot.example.com
    service: http://localhost:18080
remote_access_tailscale_hostname: homelab
remote_access_tailscale_accept_routes: true

# Apt packages for common role
homelab_apt_packages:
  - ca-certificates
  - curl
  - jq
  - git
  - build-essential
  - cmake
  - alsa-utils
  - sox
  - python3
  - python3-venv
  - python3-pip
