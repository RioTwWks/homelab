---
- name: Moltbot homelab — voice stack only
  hosts: homelab
  gather_facts: true

  pre_tasks:
    - name: Set install directory
      ansible.builtin.set_fact:
        moltbot_install_dir: "{{ moltbot_install_dir | default(playbook_dir + '/../..', true) }}"

    - name: Load local overrides
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../group_vars/local.yml"
      failed_when: false

  roles:
    - role: common
      tags: [common]
    - role: voice
      tags: [voice]
    - role: systemd
      tags: [systemd]
      vars:
        moltbot_enable_systemd_whisper: true
