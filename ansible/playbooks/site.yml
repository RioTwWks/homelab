---
- name: Moltbot homelab — full site deploy
  hosts: homelab
  gather_facts: true

  pre_tasks:
    - name: Set install directory
      ansible.builtin.set_fact:
        moltbot_install_dir: "{{ moltbot_install_dir | default(playbook_dir + '/../..', true) }}"

    - name: Load local overrides
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../group_vars/local.yml"
      failed_when: false

    - name: Resolve compose profiles from preset
      ansible.builtin.set_fact:
        moltbot_profiles: "{{ moltbot_profile_presets[moltbot_preset] }}"
      when: moltbot_profiles is not defined

  roles:
    - role: common
      tags: [common, deps]
    - role: ollama
      when: moltbot_enable_ollama | bool
      tags: [ollama]
    - role: moltbot_compose
      tags: [compose, docker]
    - role: voice
      when: moltbot_enable_voice | bool
      tags: [voice]
    - role: systemd
      tags: [systemd, backup]

  post_tasks:
    - name: Health check (moltbot-api)
      ansible.builtin.uri:
        url: http://localhost:18080/healthz
        status_code: 200
      register: health
      retries: 12
      delay: 5
      until: health.status == 200
      tags: [compose, docker]

    - name: Install summary
      ansible.builtin.debug:
        msg:
          - "Moltbot API: http://localhost:18080/healthz"
          - "Web UI: http://localhost:18079 (profile ui)"
          - "Profiles: {{ moltbot_profiles | join(', ') }}"
          - "Next: make health  |  docs/install.md"
